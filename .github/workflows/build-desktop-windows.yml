name: Build Desktop — Windows

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        default: "main"

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @workspace/shared build
          pnpm --filter @workspace/db build

      - name: Build desktop app
        run: pnpm --filter @workspace/needsops-desktop build

      - name: Package — Windows x64 NSIS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ""          # no code signing for dev builds
        run: pnpm --filter @workspace/needsops-desktop dist:win

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: needsops-desktop-windows
          path: artifacts/needsops-desktop/release/**/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/needsops-desktop/release/**/*.exe
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
