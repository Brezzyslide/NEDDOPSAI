kind = "mobile"
previewPath = "/mobile/"
title = "NeedsOps AI+ Mobile"
version = "1.0.0"
id = "artifacts/needsops-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 26212

[services.development]
run = "pnpm --filter @workspace/needsops-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/needsops-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/needsops-mobile", "run", "serve" ]

[services.env]
PORT = "26212"
BASE_PATH = "/mobile/"
